services:
  tabadl-alkon-crm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: tabadl-alkon-crm
    restart: unless-stopped
    ports:
      - "2006:2006"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:./db/custom.db}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AUTH_URL=${AUTH_URL:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:2006}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:2006}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:2006}
      - WHATSAPP_DOCUMENT_BASE_URL=${WHATSAPP_DOCUMENT_BASE_URL:-}
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=1024
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      # WhatsApp Configuration (should be configured in admin panel or via environment variables)
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      # Push Notifications (VAPID keys - required for browser push)
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./prisma/db:/app/prisma/db:rw
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    # Note: Ensure uploads/applications and uploads/leads directories exist on host
    # Run: mkdir -p uploads/applications uploads/leads prisma/db && chmod -R 755 uploads prisma/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - tabadl-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tabadl-network:
    driver: bridge
